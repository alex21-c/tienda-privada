<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin | TIENDA PRIVADA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Poppins', 'Inter', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #F5F9F7 0%, #EFF5F0 50%, #E8F1ED 100%);
            padding: 24px;
            color: #4a5d54;
            min-height: 100vh;
        }

        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        
        .login-box {
            max-width: 400px;
            margin: 15vh auto;
            padding: 45px;
            text-align: center;
            background: white;
            border: 2px solid #C7E5D8;
            border-radius: 20px;
        }
        
        .login-box h2 { color: #6BA873; margin-bottom: 28px; }
        .login-box input {
            width: 100%;
            padding: 14px;
            margin: 14px 0;
            border: 2px solid #D8ECDF;
            border-radius: 12px;
        }
        .login-box button {
            width: 100%;
            padding: 14px;
            background: #A8D5B8;
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
        }
        
        .admin-panel { max-width: 1400px; margin: 0 auto; display: none; }
        
        .neo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: white;
            border: 2px solid #D8ECDF;
            border-radius: 16px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }
        
        .badge { 
            background: #D4F1D8;
            padding: 6px 18px; 
            border-radius: 20px; 
            font-size: 0.7rem; 
            margin-left: 12px;
        }
        
        .tabs {
            display: flex;
            gap: 12px;
            background: white;
            padding: 12px;
            border-radius: 14px;
            margin-bottom: 28px;
            border: 2px solid #D8ECDF;
            flex-wrap: wrap;
        }

        .tab {
            padding: 12px 26px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            color: #6BA873;
        }

        .tab.active {
            background: #A8D5B8;
            color: white;
        }
        
        .card {
            background: white;
            border: 2px solid #D8ECDF;
            border-radius: 14px;
            padding: 28px;
            margin-bottom: 24px;
        }
        
        .card-title {
            font-weight: 700;
            color: #6BA873;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #E0F6E4;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-bottom: 20px; }

        input, select, textarea {
            width: 100%;
            padding: 14px 16px;
            background: #F5FBF8;
            border: 2px solid #D8ECDF;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
        }
        
        .btn { 
            padding: 12px 24px; 
            border-radius: 10px; 
            font-weight: 700; 
            cursor: pointer; 
            border: none;
        }

        .btn-primary { 
            background: #A8D5B8;
            color: white;
        }

        .btn-outline { 
            background: #F5FBF8;
            border: 2px solid #D8ECDF; 
            color: #6BA873;
        }

        .btn-danger { 
            background: #F5C5C5;
            color: #8B5252;
        }
        
        .table-wrapper { overflow-x: auto; }
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th { padding: 14px; background: #E8F1ED; color: #4a7654; }
        .data-table td { padding: 12px; border-bottom: 1px solid #E8F1ED; }
        
        .color-chip { 
            background: #F5FBF8;
            border-radius: 12px; 
            padding: 20px; 
            margin-bottom: 16px; 
            border: 2px solid #D8ECDF;
        }
        
        .flex-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
        .tallas-group { margin-left: 28px; padding: 14px; background: #EFF5F0; border-radius: 10px; }
        
        .toast { 
            position: fixed; 
            bottom: 25px; 
            right: 25px; 
            background: #A8D5B8;
            color: white;
            padding: 14px 28px; 
            border-radius: 10px; 
            z-index: 1100; 
        }
        .toast.error { background: #F5C5C5; color: #8B5252; }
        
        .vacio { text-align: center; padding: 40px; color: #8AB894; }
        
        @media (max-width: 700px) { 
            .neo-header { flex-direction: column; text-align: center; } 
            .tab { padding: 8px 16px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

<!-- Login -->
<div id="loginBox" class="login-box">
    <h2>🌿 TIENDA PRIVADA</h2>
    <input type="password" id="adminPass" placeholder="Contraseña" autofocus>
    <button onclick="handleLogin()">Acceder al panel</button>
</div>

<!-- Panel Admin -->
<div id="adminPanel" class="admin-panel">
    <div class="neo-header">
        <div><h1>🌿 TIENDA PRIVADA <span class="badge">ADMIN</span></h1></div>
        <div><a href="https://alex21-c.github.io/tienda-privada/" target="_blank" style="color:#6BA873;">→ Ver tienda</a></div>
    </div>
    
    <div class="tabs">
        <button class="tab active" data-tab="agregar">➕ Nuevo producto</button>
        <button class="tab" data-tab="editar">✏️ Editar</button>
        <button class="tab" data-tab="pedidos">📦 Pedidos</button>
        <button class="tab" data-tab="listar">📋 Inventario</button>
    </div>
    
    <!-- Tab AGREGAR -->
    <div id="tabAgregar" class="tab-content">
        <div class="card">
            <div class="card-title">📦 Información básica</div>
            <div class="form-grid">
                <input type="text" id="prodName" placeholder="Nombre del producto">
                <input type="number" id="prodPrice" placeholder="Precio base" step="0.01">
                <select id="prodPlatform">
                    <option value="Amazon">Amazon</option><option value="Temu">Temu</option>
                    <option value="Shein">Shein</option>
                </select>
                <input type="text" id="prodImage" placeholder="URL imagen principal">
                <input type="text" id="prodLink" placeholder="URL producto original">
                <select id="prodGender">
                    <option value="unisex">Unisex</option><option value="hombre">Hombre</option>
                    <option value="mujer">Mujer</option><option value="niño">Niño</option><option value="niña">Niña</option>
                </select>
                <select id="prodCategory">
                    <option value="">Sin categoría</option>
                    <option value="Ropa">👕 Ropa</option>
                    <option value="Zapatos">👟 Zapatos</option>
                    <option value="Accesorios">💍 Accesorios</option>
                    <option value="Cuidado de la piel">🧴 Cuidado de la piel</option>
                    <option value="Cuidado del cabello">💇 Cuidado del cabello</option>
                    <option value="Electrónica">📱 Electrónica</option>
                    <option value="Perfumes">🌸 Perfumes</option> 
                </select>
                <textarea id="prodDesc" rows="2" placeholder="Descripción corta..."></textarea>
            </div>
        </div>
        
        <div class="card">
            <div class="card-title">🎨 Variantes (colores + tallas)</div>
            <div id="variantsContainer"></div>
            <button class="btn btn-outline" style="margin-top: 12px;" onclick="addColorVariant()">+ Agregar color</button>
        </div>
        
        <div style="display: flex; gap: 12px; flex-wrap: wrap;">
            <button class="btn btn-primary" onclick="saveProduct()">💾 Guardar producto</button>
            <button class="btn btn-outline" onclick="resetForm()">🔄 Limpiar</button>
        </div>
    </div>
    
    <!-- Tab EDITAR -->
    <div id="tabEditar" class="tab-content" style="display: none;">
        <div class="card">
            <div class="card-title">
                <span>✏️ Edición rápida</span>
                <button class="btn btn-outline" onclick="cargarProductosEditor()">⟳ Recargar</button>
            </div>
            <div id="editableTable" class="table-wrapper"></div>
        </div>
    </div>
    
    <!-- Tab PEDIDOS -->
    <div id="tabPedidos" class="tab-content" style="display: none;">
        <div class="card">
            <div class="card-title">📦 Últimos pedidos</div>
            <div id="ordersList"></div>
        </div>
    </div>
    
    <!-- Tab LISTAR -->
    <div id="tabListar" class="tab-content" style="display: none;">
        <div class="card">
            <div class="card-title">📋 Productos registrados</div>
            <div id="simpleProductList"></div>
        </div>
    </div>
</div>

<script>
// ==================== VARIABLES ====================
const API_URL = 'https://script.google.com/macros/s/AKfycby6Lzye_pHp4FgWkm5WRFwQwrN42Yc32KtABgiVJKl2fCXFu2QoH7yQnAiNomZURhSbnw/exec';
let productosActuales = [];
let coloresAgregar = [];

// ==================== LOGIN ====================
function handleLogin() {
    const pass = document.getElementById('adminPass').value;
    if (pass === 'admin123') {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        cargarProductosExistentes();
        cargarPedidosAdmin();
        cargarProductosEditor();
        configurarTabs();
        toast('✅ Sesión iniciada');
    } else {
        toast('❌ Contraseña incorrecta', true);
    }
}

document.getElementById('adminPass').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') handleLogin();
});

function toast(msg, isError = false) {
    const t = document.createElement('div'); 
    t.className = 'toast'; 
    if (isError) t.className += ' error';
    t.innerText = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3000);
}

// ==================== OBTENER ÚLTIMO ID ====================
async function obtenerUltimoIdCorrecto() {
    try {
        const response = await fetch(`${API_URL}?action=getUltimoId&t=${Date.now()}`);
        const resultado = await response.json();
        console.log('Último ID desde servidor:', resultado);
        return resultado.ultimoId || 0;
    } catch (error) {
        console.error('Error obteniendo último ID:', error);
        // Si falla, calcular localmente
        if (productosActuales.length > 0) {
            return Math.max(...productosActuales.map(p => parseInt(p.id) || 0));
        }
        return 0;
    }
}

// ==================== EDITAR PRODUCTOS ====================
async function cargarProductosEditor() {
    try {
        const response = await fetch(`${API_URL}?action=getProductos&t=${Date.now()}`);
        productosActuales = await response.json();
        renderizarEditorProductos();
    } catch (error) {
        document.getElementById('editableTable').innerHTML = '<p class="vacio">Error cargando productos</p>';
    }
}

function renderizarEditorProductos() {
    const container = document.getElementById('editableTable');
    if (!productosActuales || productosActuales.length === 0) {
        container.innerHTML = '<p class="vacio">No hay productos</p>';
        return;
    }
    
    let html = `<table class="data-table"><thead><tr><th>ID</th><th>Nombre</th><th>Precio</th><th>Origen</th><th>Acciones</th></tr></thead><tbody>`;
    
    productosActuales.forEach(prod => {
        html += `
            <tr>
                <td><strong>#${prod.id}</strong></td>
                <td>${escapeHtml(prod.nombre.substring(0, 40))}</td>
                <td>$${prod.precio.toFixed(2)}</td>
                <td>${prod.origen || '-'}</td>
                <td>
                    <button class="btn btn-primary" style="padding:6px 12px; font-size:0.75rem;" onclick="editarProductoCompleto(${prod.id})">✏️ Editar</button>
                    <button class="btn btn-danger" style="padding:6px 12px; font-size:0.75rem;" onclick="eliminarProducto(${prod.id})">🗑️</button>
                </td>
            </tr>
        `;
    });
    
    html += `</tbody></table>`;
    container.innerHTML = html;
}

function editarProductoCompleto(id) {
    const producto = productosActuales.find(p => p.id == id);
    if (!producto) return;
    
    const nuevoNombre = prompt('Nuevo nombre:', producto.nombre);
    const nuevoPrecio = prompt('Nuevo precio:', producto.precio);
    
    if (nuevoNombre && nuevoPrecio && !isNaN(parseFloat(nuevoPrecio))) {
        guardarEdicionCompleta(id, nuevoNombre, parseFloat(nuevoPrecio));
    }
}

async function guardarEdicionCompleta(id, nombre, precio) {
    try {
        await fetch(API_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({ action: 'actualizarPrecio', id, precio, nombre })
        });
        toast('✅ Producto actualizado');
        setTimeout(() => {
            cargarProductosEditor();
            cargarProductosExistentes();
        }, 1000);
    } catch(e) {
        toast('❌ Error', true);
    }
}

async function eliminarProducto(id) {
    if (confirm(`¿Eliminar producto #${id}?`)) {
        await fetch(API_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({ action: 'eliminarProducto', id })
        });
        toast('✅ Eliminado');
        setTimeout(() => {
            cargarProductosExistentes();
            cargarProductosEditor();
        }, 1000);
    }
}

// ==================== PEDIDOS ====================
async function cargarPedidosAdmin() {
    try {
        const response = await fetch(`${API_URL}?action=getPedidosConEnlaces&t=${Date.now()}`);
        const pedidos = await response.json();
        const container = document.getElementById('ordersList');
        if (!pedidos || !pedidos.length) { container.innerHTML = '<p class="vacio">Sin pedidos</p>'; return; }
        container.innerHTML = '';
        pedidos.forEach(pedido => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div style="display: flex; justify-content: space-between; flex-wrap: wrap;">
                    <strong>#${pedido.idPedido || pedido.id}</strong>
                    <span>📅 ${new Date(pedido.fecha).toLocaleString()}</span>
                    <span style="background:${pedido.estado === 'Pendiente' ? '#F5C5C5' : '#D4F1D8'}; padding:4px 12px; border-radius:8px;">${pedido.estado || 'Pendiente'}</span>
                </div>
                <div><strong>👤 ${pedido.nombre}</strong> | 📱 ${pedido.telefono || 'N/A'}</div>
                <div>📍 ${pedido.direccion}</div>
                <div><strong>💰 Total: $${(pedido.total || 0).toFixed(2)}</strong></div>
                <div style="margin-top: 10px; display: flex; gap: 10px;">
                    <select onchange="cambiarEstadoPedido(${pedido.id}, this.value)" style="padding:6px 12px;">
                        <option value="Pendiente" ${pedido.estado === 'Pendiente' ? 'selected' : ''}>⏳ Pendiente</option>
                        <option value="Pagado" ${pedido.estado === 'Pagado' ? 'selected' : ''}>✅ Pagado</option>
                        <option value="Enviado" ${pedido.estado === 'Enviado' ? 'selected' : ''}>📦 Enviado</option>
                        <option value="Entregado" ${pedido.estado === 'Entregado' ? 'selected' : ''}>🏠 Entregado</option>
                    </select>
                    <button class="btn btn-outline" onclick="registrarPagoModal(${pedido.id}, ${pedido.total || 0}, '${pedido.nombre.replace(/'/g, "\\'")}')">💰 Registrar Pago</button>
                </div>
            `;
            container.appendChild(card);
        });
    } catch (error) { 
        document.getElementById('ordersList').innerHTML = '<p class="vacio">Error cargando pedidos</p>';
    }
}

async function cambiarEstadoPedido(id, estado) {
    await fetch(API_URL, {
        method: 'POST',
        mode: 'no-cors',
        body: JSON.stringify({ action: 'actualizarEstado', fila: id, estado })
    });
    toast('✅ Estado actualizado');
    cargarPedidosAdmin();
}

function registrarPagoModal(id, total, nombre) {
    const monto = prompt(`💰 Monto pagado\n"${nombre}"\nTotal: $${total.toFixed(2)}`, total.toFixed(2));
    if (monto && !isNaN(parseFloat(monto))) {
        const metodoPago = prompt('Método de pago (Efectivo/Yappy/Transferencia):', 'Efectivo');
        fetch(API_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({ 
                action: 'registrarPago', 
                idPedido: id, 
                fila: id, 
                montoPagado: parseFloat(monto),
                metodoPagoReal: metodoPago || 'Efectivo'
            })
        });
        toast(`✅ Pago registrado: $${parseFloat(monto).toFixed(2)}`);
        cargarPedidosAdmin();
    }
}

// ==================== PRODUCTOS LISTAR ====================
async function cargarProductosExistentes() {
    try {
        const response = await fetch(`${API_URL}?action=getProductos&t=${Date.now()}`);
        productosActuales = await response.json();
        mostrarListaProductos();
    } catch (error) { 
        document.getElementById('simpleProductList').innerHTML = '<p class="vacio">Error cargando</p>';
    }
}

function mostrarListaProductos() {
    const container = document.getElementById('simpleProductList');
    if (!productosActuales || !productosActuales.length) { 
        container.innerHTML = '<p class="vacio">No hay productos</p>'; 
        return; 
    }
    container.innerHTML = '';
    productosActuales.forEach(prod => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
                <strong style="color:#6BA873;">#${prod.id}</strong>
                <strong>${prod.nombre.substring(0, 55)}</strong>
                <div>
                    <button class="btn btn-outline" style="padding: 6px 14px;" onclick="editarPrecioRapido(${prod.id}, ${prod.precio})">✏️ Precio</button>
                    <button class="btn btn-danger" style="padding: 6px 14px;" onclick="eliminarProducto(${prod.id})">🗑️</button>
                </div>
            </div>
            <div>💰 $${prod.precio.toFixed(2)} | 📦 ${prod.origen} | 👤 ${prod.genero || 'unisex'}</div>
            ${prod.enlace ? `<div><a href="${prod.enlace}" target="_blank" style="color:#6BA873;">🔗 Ver original</a></div>` : ''}
        `;
        container.appendChild(div);
    });
}

function editarPrecioRapido(id, precioActual) {
    const nuevoPrecio = prompt('Nuevo precio:', precioActual);
    if (nuevoPrecio && !isNaN(parseFloat(nuevoPrecio))) {
        fetch(API_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({ action: 'actualizarPrecio', id, precio: parseFloat(nuevoPrecio) })
        });
        toast('✅ Precio actualizado');
        setTimeout(() => { cargarProductosExistentes(); cargarProductosEditor(); }, 1000);
    }
}

// ==================== VARIANTES ====================
function addColorVariant() { 
    coloresAgregar.push({ id: Date.now(), nombre: '', imagen: '', precio: '', tallas: [] }); 
    renderizarColoresAgregar(); 
}

function removeColorVariant(id) { 
    coloresAgregar = coloresAgregar.filter(c => c.id !== id); 
    renderizarColoresAgregar(); 
}

function updateColorField(id, field, val) { 
    const c = coloresAgregar.find(c => c.id === id); 
    if(c) c[field] = val; 
}

function addSizeToColor(id) { 
    const c = coloresAgregar.find(c => c.id === id); 
    if(c) c.tallas.push({ talla: '', precio: '' }); 
    renderizarColoresAgregar(); 
}

function removeSize(colorId, idx) { 
    const c = coloresAgregar.find(c => c.id === colorId); 
    if(c) c.tallas.splice(idx,1); 
    renderizarColoresAgregar(); 
}

function updateSize(colorId, idx, field, val) { 
    const c = coloresAgregar.find(c => c.id === colorId); 
    if(c && c.tallas[idx]) c.tallas[idx][field] = val; 
}

function renderizarColoresAgregar() {
    const container = document.getElementById('variantsContainer');
    if (!container) return;
    if (!coloresAgregar.length) { 
        container.innerHTML = '<p style="color:#8AB894;">Agrega colores con tallas</p>'; 
        return; 
    }
    container.innerHTML = coloresAgregar.map(c => `
        <div class="color-chip">
            <div class="flex-row">
                <input type="text" placeholder="Color" value="${c.nombre}" style="flex:2" onchange="updateColorField(${c.id},'nombre',this.value)">
                <input type="text" placeholder="Imagen URL" value="${c.imagen}" style="flex:3" onchange="updateColorField(${c.id},'imagen',this.value)">
                <input type="number" placeholder="Precio" value="${c.precio}" step="0.01" style="flex:1" onchange="updateColorField(${c.id},'precio',parseFloat(this.value) || 0)">
                <button class="btn btn-danger" onclick="removeColorVariant(${c.id})">🗑️</button>
            </div>
            <div class="tallas-group">
                <strong>📏 Tallas</strong>
                <div>
                    ${c.tallas.map((t, idx) => `
                        <div class="flex-row">
                            <input type="text" placeholder="Talla" value="${t.talla}" style="width:100px;" onchange="updateSize(${c.id},${idx},'talla',this.value)">
                            <input type="number" placeholder="Precio" value="${t.precio}" step="0.01" style="width:120px;" onchange="updateSize(${c.id},${idx},'precio',parseFloat(this.value) || 0)">
                            <button class="btn btn-danger" onclick="removeSize(${c.id},${idx})">✕</button>
                        </div>
                    `).join('')}
                </div>
                <button class="btn btn-outline" onclick="addSizeToColor(${c.id})">+ Talla</button>
            </div>
        </div>
    `).join('');
}

// ==================== GUARDAR PRODUCTO - VERSIÓN FUNCIONAL ====================
async function saveProduct() {
    const nombre = document.getElementById('prodName').value;
    const precioBase = parseFloat(document.getElementById('prodPrice').value);
    
    if (!nombre || !precioBase) {
        toast('❌ Completa nombre y precio', true);
        return;
    }
    
    toast('💾 Guardando producto...');
    
    // Obtener el último ID real desde el servidor
    const ultimoId = await obtenerUltimoIdCorrecto();
    const nuevoId = ultimoId + 1;
    
    console.log(`📝 Guardando producto con ID: ${nuevoId} (último ID era: ${ultimoId})`);
    
    // Preparar datos
    const coloresNombres = coloresAgregar.map(c => c.nombre).filter(n => n).join(',');
    const coloresImagenes = coloresAgregar.map(c => c.imagen).filter(i => i).join(',');
    const coloresPrecios = coloresAgregar.map(c => c.precio).filter(p => p).join(',');
    
    let variantesTexto = '';
    if (coloresAgregar.length) {
        variantesTexto = coloresAgregar
            .filter(c => c.tallas && c.tallas.length && c.nombre)
            .map(c => {
                const tallasValidas = c.tallas.filter(t => t.talla && t.precio);
                if (tallasValidas.length === 0) return null;
                return `${c.nombre}:${tallasValidas.map(t => `${t.talla}:${t.precio}`).join(',')}`;
            })
            .filter(v => v)
            .join('|');
    }
    
    const payload = {
        action: 'agregarProducto',
        nombre: nombre,
        precio: precioBase,
        origen: document.getElementById('prodPlatform').value,
        imagen: document.getElementById('prodImage').value || 'https://via.placeholder.com/300x200',
        enlace: document.getElementById('prodLink').value || '',
        categoria_genero: document.getElementById('prodGender').value,
        descripcion: document.getElementById('prodDesc').value || 'Producto de alta calidad',
        colores_nombres: coloresNombres,
        colores_imagenes: coloresImagenes,
        colores_precios: coloresPrecios,
        tiene_variantes: (coloresAgregar.length && variantesTexto) ? 'SI' : 'NO',
        variantes: variantesTexto,
        categoria: document.getElementById('prodCategory').value,
        activo: 'SI'
    };
    
    console.log('Payload enviado:', payload);
    
    try {
        const response = await fetch(API_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify(payload)
        });
        
        // Con mode: 'no-cors' no podemos leer la respuesta,
        // pero el producto debería haberse guardado
        toast(`✅ Producto "${nombre}" enviado con ID: ${nuevoId}`);
        console.log('Producto enviado (no-cors)');
        
        resetForm();
        
        // Recargar después de 2 segundos
        setTimeout(() => {
            cargarProductosExistentes();
            cargarProductosEditor();
        }, 2000);
        
    } catch (error) {
        console.error('Error:', error);
        toast('⚠️ Error al guardar. Revisa la consola.', true);
    }
}

function resetForm() {
    document.getElementById('prodName').value = '';
    document.getElementById('prodPrice').value = '';
    document.getElementById('prodImage').value = '';
    document.getElementById('prodLink').value = '';
    document.getElementById('prodDesc').value = '';
    document.getElementById('prodCategory').value = '';
    document.getElementById('prodGender').value = 'unisex';
    document.getElementById('prodPlatform').value = 'Amazon';
    coloresAgregar = [];
    renderizarColoresAgregar();
}

function escapeHtml(str) { 
    if(!str) return ''; 
    return String(str).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]); 
}

// ==================== TABS ====================
function configurarTabs() {
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            const target = tab.dataset.tab;
            document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
            if (target === 'agregar') document.getElementById('tabAgregar').style.display = 'block';
            if (target === 'editar') { document.getElementById('tabEditar').style.display = 'block'; cargarProductosEditor(); }
            if (target === 'pedidos') { document.getElementById('tabPedidos').style.display = 'block'; cargarPedidosAdmin(); }
            if (target === 'listar') { document.getElementById('tabListar').style.display = 'block'; cargarProductosExistentes(); }
        });
    });
    document.getElementById('tabAgregar').style.display = 'block';
}

function init() {
    renderizarColoresAgregar();
}
init();
</script>
