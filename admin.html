<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TIENDA PRIVADA | ADMIN</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter',sans-serif;
background:#050816;
color:white;
overflow-x:hidden;
}

/* =========================
BACKGROUND
========================= */

.bg{
position:fixed;
inset:0;
background:
radial-gradient(circle at top left,#00e5ff22,transparent 30%),
radial-gradient(circle at bottom right,#7c4dff22,transparent 30%),
linear-gradient(135deg,#050816,#0b1020);
z-index:-1;
}

/* =========================
LOGIN
========================= */

.login-screen{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.login-box{
width:100%;
max-width:420px;
background:rgba(255,255,255,.05);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.08);
border-radius:28px;
padding:40px;
box-shadow:0 10px 40px rgba(0,0,0,.5);
}

.login-title{
font-size:2rem;
font-weight:900;
margin-bottom:10px;
}

.login-sub{
color:#9ca3af;
margin-bottom:30px;
}

.input{
width:100%;
padding:16px;
background:#0f172a;
border:1px solid rgba(255,255,255,.08);
border-radius:16px;
color:white;
font-size:1rem;
outline:none;
margin-bottom:20px;
}

.btn{
width:100%;
padding:16px;
border:none;
border-radius:16px;
background:linear-gradient(135deg,#00e5ff,#7c4dff);
color:white;
font-weight:800;
font-size:1rem;
cursor:pointer;
transition:.3s;
}

.btn:hover{
transform:translateY(-2px);
box-shadow:0 10px 25px rgba(124,77,255,.4);
}

/* =========================
LAYOUT
========================= */

.app{
display:none;
min-height:100vh;
}

.sidebar{
position:fixed;
left:0;
top:0;
bottom:0;
width:280px;
background:rgba(255,255,255,.05);
backdrop-filter:blur(20px);
border-right:1px solid rgba(255,255,255,.08);
padding:30px 20px;
overflow:auto;
}

.logo{
font-size:1.8rem;
font-weight:900;
margin-bottom:40px;
}

.menu{
display:flex;
flex-direction:column;
gap:10px;
}

.menu button{
background:none;
border:none;
padding:16px;
border-radius:18px;
color:#cbd5e1;
font-weight:700;
cursor:pointer;
text-align:left;
transition:.3s;
font-size:1rem;
}

.menu button:hover,
.menu button.active{
background:linear-gradient(135deg,#00e5ff22,#7c4dff22);
color:white;
}

.content{
margin-left:280px;
padding:30px;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
flex-wrap:wrap;
gap:20px;
}

.top-title{
font-size:2rem;
font-weight:900;
}

.logout{
padding:12px 18px;
border-radius:14px;
border:none;
background:#111827;
color:white;
cursor:pointer;
}

/* =========================
CARDS
========================= */

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:24px;
}

.card{
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
backdrop-filter:blur(18px);
border-radius:28px;
overflow:hidden;
transition:.3s;
position:relative;
}

.card:hover{
transform:translateY(-6px);
border-color:#00e5ff55;
}

.product-image{
width:100%;
height:240px;
object-fit:cover;
background:#111827;
}

.card-body{
padding:22px;
}

.product-id{
display:inline-block;
padding:8px 14px;
border-radius:999px;
background:#00e5ff22;
color:#00e5ff;
font-size:.8rem;
font-weight:800;
margin-bottom:14px;
cursor:pointer;
}

.product-title{
font-size:1.3rem;
font-weight:800;
margin-bottom:12px;
}

.product-desc{
color:#94a3b8;
font-size:.95rem;
margin-bottom:20px;
line-height:1.6;
}

.price{
font-size:1.5rem;
font-weight:900;
margin-bottom:16px;
color:#00e5ff;
}

.meta{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-bottom:20px;
}

.tag{
padding:8px 14px;
border-radius:999px;
background:#111827;
font-size:.8rem;
font-weight:700;
}

.actions{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.action-btn{
flex:1;
padding:12px;
border:none;
border-radius:14px;
font-weight:700;
cursor:pointer;
}

.edit-btn{
background:linear-gradient(135deg,#00e5ff,#2563eb);
color:white;
}

.delete-btn{
background:#ef4444;
color:white;
}

/* =========================
ADD PRODUCT
========================= */

.form-box{
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
padding:30px;
border-radius:28px;
margin-bottom:30px;
}

.form-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:18px;
}

textarea.input{
min-height:120px;
resize:none;
}

/* =========================
MODAL
========================= */

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.8);
display:none;
align-items:center;
justify-content:center;
padding:20px;
z-index:999;
}

.modal-box{
width:100%;
max-width:700px;
background:#0f172a;
border-radius:30px;
padding:30px;
max-height:90vh;
overflow:auto;
}

.modal-title{
font-size:1.8rem;
font-weight:900;
margin-bottom:25px;
}

.save-btn{
background:linear-gradient(135deg,#00e5ff,#7c4dff);
}

/* =========================
RESPONSIVE
========================= */

@media(max-width:900px){

.sidebar{
position:relative;
width:100%;
height:auto;
}

.content{
margin-left:0;
}

}

</style>
</head>

<body>

<div class="bg"></div>

<!-- LOGIN -->

<div class="login-screen" id="loginScreen">

<div class="login-box">

<div class="login-title">
🌌 TIENDA PRIVADA
</div>

<div class="login-sub">
Panel tecnológico premium
</div>

<input type="password" class="input" id="password" placeholder="Contraseña admin">

<button class="btn" onclick="login()">
ACCEDER
</button>

</div>

</div>

<!-- APP -->

<div class="app" id="app">

<div class="sidebar">

<div class="logo">
⚡ ADMIN PRO
</div>

<div class="menu">

<button class="active">
📦 Inventario
</button>

<button>
🛒 Pedidos
</button>

<button>
📊 Analytics
</button>

<button>
⚙️ Configuración
</button>

</div>

</div>

<div class="content">

<div class="topbar">

<div class="top-title">
Inventario Premium
</div>

<button class="logout" onclick="logout()">
Cerrar sesión
</button>

</div>

<!-- ADD PRODUCT -->

<div class="form-box">

<h2 style="margin-bottom:25px;">
➕ Agregar Producto
</h2>

<div class="form-grid">

<input class="input" id="nombre" placeholder="Nombre">

<input class="input" id="precio" placeholder="Precio">

<input class="input" id="imagen" placeholder="URL imagen">

<input class="input" id="categoria" placeholder="Categoría">

<input class="input" id="tallas" placeholder="Tallas Ej: 40,41,42">

<input class="input" id="colores" placeholder="Colores">

<input class="input" id="stock" placeholder="Stock">

<input class="input" id="link" placeholder="Link producto">

<select class="input" id="disponible">

<option value="SI">Disponible</option>
<option value="NO">No disponible</option>

</select>

</div>

<textarea class="input" id="descripcion" placeholder="Descripción"></textarea>

<button class="btn" onclick="agregarProducto()">
Guardar Producto
</button>

</div>

<!-- INVENTARIO -->

<div class="grid" id="inventarioGrid">

</div>

</div>

</div>

<!-- MODAL -->

<div class="modal" id="modal">

<div class="modal-box">

<div class="modal-title">
✏️ Editar Producto
</div>

<input type="hidden" id="editId">

<div class="form-grid">

<input class="input" id="editNombre">

<input class="input" id="editPrecio">

<input class="input" id="editImagen">

<input class="input" id="editCategoria">

<input class="input" id="editTallas">

<input class="input" id="editColores">

<input class="input" id="editStock">

<input class="input" id="editLink">

<select class="input" id="editDisponible">

<option value="SI">Disponible</option>
<option value="NO">No disponible</option>

</select>

</div>

<textarea class="input" id="editDescripcion"></textarea>

<button class="btn save-btn" onclick="guardarEdicion()">
Guardar Cambios
</button>

</div>

</div>

<script>

const API_URL = 'https://script.google.com/macros/s/AKfycby6Lzye_pHp4FgWkm5WRFwQwrN42Yc32KtABgiVJKl2fCXFu2QoH7yQnAiNomZURhSbnw/exec';

let productos = [];

/* =========================
LOGIN
========================= */

function login(){

const pass = document.getElementById('password').value;

if(pass === 'admin123'){

document.getElementById('loginScreen').style.display='none';

document.getElementById('app').style.display='block';

cargarProductos();

}else{

alert('Contraseña incorrecta');

}

}

function logout(){

location.reload();

}

/* =========================
CARGAR PRODUCTOS
========================= */

async function cargarProductos(){

try{

const res = await fetch(`${API_URL}?action=getProductos&t=${Date.now()}`);

productos = await res.json();

renderProductos();

}catch(err){

console.error(err);

}

}

/* =========================
RENDER
========================= */

function renderProductos(){

const grid = document.getElementById('inventarioGrid');

if(!productos.length){

grid.innerHTML = `
<div style="padding:40px;">
No hay productos
</div>
`;

return;

}

grid.innerHTML = productos.map(producto => `

<div class="card">

<img src="${producto.imagen}" class="product-image">

<div class="card-body">

<div class="product-id"
onclick="abrirEditor('${producto.id}')">
ID: ${producto.id}
</div>

<div class="product-title">
${producto.nombre}
</div>

<div class="product-desc">
${producto.descripcion}
</div>

<div class="price">
$${producto.precio}
</div>

<div class="meta">

<div class="tag">
📏 ${producto.tallas}
</div>

<div class="tag">
🎨 ${producto.colores}
</div>

<div class="tag">
📦 ${producto.stock}
</div>

<div class="tag">
${producto.disponible}
</div>

</div>

<div style="margin-bottom:20px;">

<a href="${producto.link}" target="_blank" style="color:#00e5ff;">
🔗 Ver producto
</a>

</div>

<div class="actions">

<button class="action-btn edit-btn"
onclick="abrirEditor('${producto.id}')">
Editar
</button>

<button class="action-btn delete-btn">
Eliminar
</button>

</div>

</div>

</div>

`).join('');

}

/* =========================
EDITOR
========================= */

function abrirEditor(id){

const p = productos.find(x=>x.id==id);

if(!p) return;

document.getElementById('modal').style.display='flex';

document.getElementById('editId').value = p.id;
document.getElementById('editNombre').value = p.nombre;
document.getElementById('editPrecio').value = p.precio;
document.getElementById('editImagen').value = p.imagen;
document.getElementById('editCategoria').value = p.categoria;
document.getElementById('editTallas').value = p.tallas;
document.getElementById('editColores').value = p.colores;
document.getElementById('editStock').value = p.stock;
document.getElementById('editLink').value = p.link;
document.getElementById('editDisponible').value = p.disponible;
document.getElementById('editDescripcion').value = p.descripcion;

}

window.onclick = function(e){

if(e.target.id === 'modal'){

document.getElementById('modal').style.display='none';

}

}

/* =========================
GUARDAR EDICION
========================= */

function guardarEdicion(){

const id = document.getElementById('editId').value;

const p = productos.find(x=>x.id==id);

if(!p) return;

p.nombre = document.getElementById('editNombre').value;
p.precio = document.getElementById('editPrecio').value;
p.imagen = document.getElementById('editImagen').value;
p.categoria = document.getElementById('editCategoria').value;
p.tallas = document.getElementById('editTallas').value;
p.colores = document.getElementById('editColores').value;
p.stock = document.getElementById('editStock').value;
p.link = document.getElementById('editLink').value;
p.disponible = document.getElementById('editDisponible').value;
p.descripcion = document.getElementById('editDescripcion').value;

renderProductos();

document.getElementById('modal').style.display='none';

alert('Producto editado');

}

/* =========================
AGREGAR PRODUCTO
========================= */

function agregarProducto(){

const nuevo = {

id: Date.now(),

nombre: document.getElementById('nombre').value,

precio: document.getElementById('precio').value,

imagen: document.getElementById('imagen').value,

categoria: document.getElementById('categoria').value,

tallas: document.getElementById('tallas').value,

colores: document.getElementById('colores').value,

stock: document.getElementById('stock').value,

link: document.getElementById('link').value,

disponible: document.getElementById('disponible').value,

descripcion: document.getElementById('descripcion').value

};

productos.unshift(nuevo);

renderProductos();

alert('Producto agregado');

}

</script>

</body>
</html>
