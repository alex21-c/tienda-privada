<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIENDA PRIVADA | Admin Fusion</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:'Poppins',sans-serif;
background:linear-gradient(135deg,#F5F9F7 0%,#E8F1ED 100%);
padding:20px;
min-height:100vh;
color:#4a5d54;
}

.login-box{
max-width:420px;
margin:12vh auto;
padding:40px;
background:#fff;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
text-align:center;
}

.login-box input,
.login-box button,
input,
select,
textarea{
width:100%;
padding:12px;
border-radius:12px;
border:2px solid #D8ECDF;
font-family:inherit;
}

.login-box button,
.btn{
background:linear-gradient(135deg,#A8D5B8,#B8DFC7);
color:#fff;
border:none;
cursor:pointer;
font-weight:700;
transition:.3s;
}

.btn:hover{transform:translateY(-2px)}

.admin-panel{display:none;max-width:1400px;margin:auto}

.header{
background:#fff;
padding:20px;
border-radius:16px;
margin-bottom:20px;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:10px;
}

.tabs{
display:flex;
gap:10px;
margin-bottom:20px;
flex-wrap:wrap;
}

.tab{
padding:12px 20px;
background:#fff;
border-radius:12px;
cursor:pointer;
font-weight:700;
}

.tab.active{
background:#A8D5B8;
color:#fff;
}

.card{
background:#fff;
padding:24px;
border-radius:16px;
margin-bottom:20px;
}

.card-title{
font-size:1.1rem;
font-weight:700;
margin-bottom:20px;
color:#6BA873;
}

.form-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;
}

.table-wrapper{overflow:auto}

.data-table{
width:100%;
border-collapse:collapse;
min-width:1000px;
}

.data-table th,
.data-table td{
padding:12px;
border-bottom:1px solid #eee;
text-align:left;
}

.estado-badge{
display:inline-block;
padding:5px 12px;
border-radius:20px;
font-size:.75rem;
font-weight:700;
background:#E8F5E9;
color:#2E7D32;
}

.color-chip{
background:#F5FBF8;
padding:15px;
border-radius:14px;
margin-bottom:15px;
}

.flex-row{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.vacio{
text-align:center;
padding:40px;
color:#999;
}

.toast{
position:fixed;
bottom:20px;
right:20px;
background:#A8D5B8;
color:#fff;
padding:12px 20px;
border-radius:12px;
font-weight:700;
z-index:9999;
}

@media(max-width:768px){
.header{flex-direction:column}
}
</style>
</head>
<body>

<div id="loginBox" class="login-box">
<h2>🌿 TIENDA PRIVADA</h2>
<input type="password" id="adminPass" placeholder="Contraseña">
<button onclick="handleLogin()">Entrar</button>
</div>

<div id="adminPanel" class="admin-panel">

<div class="header">
<h2>🌿 Panel Administración</h2>
<button class="btn" style="padding:10px 20px" onclick="cerrarAdmin()">Cerrar sesión</button>
</div>

<div class="tabs">
<button class="tab active" data-tab="agregar">➕ Producto</button>
<button class="tab" data-tab="editar">✏️ Editar</button>
<button class="tab" data-tab="pedidos">📦 Pedidos</button>
<button class="tab" data-tab="listar">📋 Inventario</button>
<button class="tab" data-tab="solicitudes">📌 Solicitudes</button>
</div>

<!-- PRODUCTOS -->
<div id="tabAgregar" class="tab-content">
<div class="card">
<div class="card-title">📦 Nuevo producto</div>

<div class="form-grid">
<input type="text" id="prodName" placeholder="Nombre producto">
<input type="number" id="prodPrice" placeholder="Precio" step="0.01">

<select id="prodPlatform">
<option>Amazon</option>
<option>Temu</option>
<option>Shein</option>
<option>Sephora</option>
</select>

<input type="text" id="prodImage" placeholder="Imagen URL">
<input type="text" id="prodLink" placeholder="Enlace producto">

<select id="prodGender">
<option value="unisex">Unisex</option>
<option value="hombre">Hombre</option>
<option value="mujer">Mujer</option>
<option value="niño">Niño</option>
<option value="niña">Niña</option>
</select>

<select id="prodCategory">
<option value="">Categoría</option>
<option>Ropa</option>
<option>Zapatos</option>
<option>Accesorios</option>
<option>Electrónica</option>
</select>

<textarea id="prodDesc" placeholder="Descripción"></textarea>
</div>
</div>

<div class="card">
<div class="card-title">🎨 Variantes</div>
<div id="variantsContainer"></div>
<button class="btn" onclick="addColorVariant()">+ Agregar color</button>
</div>

<div class="flex-row">
<button class="btn" onclick="saveProduct()">💾 Guardar</button>
<button class="btn" onclick="resetForm()">🔄 Limpiar</button>
</div>
</div>

<!-- EDITAR -->
<div id="tabEditar" class="tab-content" style="display:none">
<div class="card">
<div class="card-title">✏️ Editor productos</div>
<div id="editableTable" class="table-wrapper"></div>
</div>
</div>

<!-- PEDIDOS -->
<div id="tabPedidos" class="tab-content" style="display:none">
<div class="card">
<div class="card-title">📦 Pedidos y tracking</div>
<div id="ordersList"></div>
</div>
</div>

<!-- INVENTARIO -->
<div id="tabListar" class="tab-content" style="display:none">
<div class="card">
<div class="card-title">📋 Inventario</div>
<div id="simpleProductList"></div>
</div>
</div>

<!-- SOLICITUDES -->
<div id="tabSolicitudes" class="tab-content" style="display:none">
<div class="card">
<div class="card-title">📌 Solicitudes</div>
<div id="solicitudesList"></div>
</div>
</div>

</div>

<script>
const API_URL='https://script.google.com/macros/s/AKfycby6Lzye_pHp4FgWkm5WRFwQwrN42Yc32KtABgiVJKl2fCXFu2QoH7yQnAiNomZURhSbnw/exec';

let productosActuales=[];
let coloresAgregar=[];
let solicitudes=[];

const estadosEnvio=[
{id:'procesando',nombre:'📋 Procesado',descripcion:'Pedido recibido'},
{id:'preparando',nombre:'📦 Preparando',descripcion:'Preparando paquete'},
{id:'miami',nombre:'✈️ Miami',descripcion:'En camino a Miami'},
{id:'miami_llegada',nombre:'📍 Llegó Miami',descripcion:'Paquete en Miami'},
{id:'panama',nombre:'🌎 Panamá',descripcion:'En camino a Panamá'},
{id:'aduana',nombre:'🛃 Aduana',descripcion:'En revisión'},
{id:'panama_llegada',nombre:'📍 Llegó Panamá',descripcion:'Paquete en Panamá'},
{id:'delivery',nombre:'🚚 Delivery',descripcion:'En ruta'},
{id:'entregado',nombre:'✅ Entregado',descripcion:'Pedido entregado'},
{id:'retrasado',nombre:'⚠️ Retrasado',descripcion:'Retraso logístico'}
];

const sonidos={
click(){playTone(500,.05)},
exito(){playTone(900,.1)},
error(){playTone(250,.15)},
guardado(){playTone(700,.1)}
};

function playTone(freq,duration){
const ctx=new(window.AudioContext||window.webkitAudioContext)();
const osc=ctx.createOscillator();
const gain=ctx.createGain();
osc.connect(gain);
gain.connect(ctx.destination);
osc.frequency.value=freq;
gain.gain.value=.2;
osc.start();
osc.stop(ctx.currentTime+duration);
setTimeout(()=>ctx.close(),300);
}

function toast(msg){
const t=document.createElement('div');
t.className='toast';
t.innerText=msg;
document.body.appendChild(t);
setTimeout(()=>t.remove(),3000);
}

function escapeHtml(str){
if(!str)return '';
return String(str).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
}

// LOGIN
function handleLogin(){
const pass=document.getElementById('adminPass').value;

if(pass==='admin123'){
sonidos.exito();
document.getElementById('loginBox').style.display='none';
document.getElementById('adminPanel').style.display='block';

cargarProductosExistentes();
cargarPedidosAdmin();
cargarProductosEditor();
renderizarSolicitudesAdmin();
}else{
sonidos.error();
alert('Contraseña incorrecta');
}
}

function cerrarAdmin(){
document.getElementById('adminPanel').style.display='none';
document.getElementById('loginBox').style.display='block';
document.getElementById('adminPass').value='';
}

// TABS

document.querySelectorAll('.tab').forEach(tab=>{
tab.addEventListener('click',()=>{

document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
tab.classList.add('active');

const name=tab.dataset.tab;

document.querySelectorAll('.tab-content').forEach(c=>c.style.display='none');

document.getElementById('tab'+name.charAt(0).toUpperCase()+name.slice(1)).style.display='block';

if(name==='pedidos') cargarPedidosAdmin();
if(name==='solicitudes') renderizarSolicitudesAdmin();
if(name==='editar') cargarProductosEditor();
if(name==='listar') cargarProductosExistentes();

});
});

// PRODUCTOS

async function saveProduct(){
const nombre=document.getElementById('prodName').value;
const precioBase=parseFloat(document.getElementById('prodPrice').value);

if(!nombre||isNaN(precioBase)){
alert('Completa campos');
return;
}

const payload={
action:'agregarProducto',
nombre,
precio:precioBase,
origen:document.getElementById('prodPlatform').value,
imagen:document.getElementById('prodImage').value,
enlace:document.getElementById('prodLink').value,
categoria_genero:document.getElementById('prodGender').value,
descripcion:document.getElementById('prodDesc').value,
categoria:document.getElementById('prodCategory').value,
tiene_variantes:coloresAgregar.length?'SI':'NO'
};

await fetch(API_URL,{
method:'POST',
mode:'no-cors',
body:JSON.stringify(payload)
});

sonidos.guardado();
toast('✅ Producto guardado');
resetForm();
cargarProductosExistentes();
}

function resetForm(){
['prodName','prodPrice','prodImage','prodLink','prodDesc'].forEach(id=>{
document.getElementById(id).value='';
});

coloresAgregar=[];
renderizarColoresAgregar();
}

function addColorVariant(){
coloresAgregar.push({
id:Date.now(),
nombre:'',
imagen:'',
precio:'',
tallas:[]
});
renderizarColoresAgregar();
}

function renderizarColoresAgregar(){
const container=document.getElementById('variantsContainer');

if(!coloresAgregar.length){
container.innerHTML='<div class="vacio">Sin variantes</div>';
return;
}

let html='';

coloresAgregar.forEach(c=>{
html+=`
<div class="color-chip">
<div class="flex-row">
<input placeholder="Color" onchange="updateColorField(${c.id},'nombre',this.value)">
<input placeholder="Imagen" onchange="updateColorField(${c.id},'imagen',this.value)">
<input type="number" placeholder="Precio" onchange="updateColorField(${c.id},'precio',this.value)">
<button class="btn" onclick="removeColorVariant(${c.id})">🗑️</button>
</div>
</div>`;
});

container.innerHTML=html;
}

function updateColorField(id,field,val){
const c=coloresAgregar.find(x=>x.id===id);
if(c)c[field]=val;
}

function removeColorVariant(id){
coloresAgregar=coloresAgregar.filter(x=>x.id!==id);
renderizarColoresAgregar();
}

async function cargarProductosExistentes(){
try{
const res=await fetch(`${API_URL}?action=getProductos&t=${Date.now()}`);
productosActuales=await res.json();
mostrarListaProductos();
}catch(e){
console.error(e);
}
}

function mostrarListaProductos(){
const container=document.getElementById('simpleProductList');

if(!productosActuales.length){
container.innerHTML='<div class="vacio">No hay productos</div>';
return;
}

let html='';

productosActuales.forEach(prod=>{
html+=`
<div class="card">
<strong>#${prod.id}</strong> - ${escapeHtml(prod.nombre)}<br>
💰 $${Number(prod.precio).toFixed(2)}
<div class="flex-row" style="margin-top:10px">
<button class="btn" onclick="editarPrecioProducto(${prod.id},${prod.precio})">✏️</button>
<button class="btn" onclick="eliminarProducto(${prod.id})">🗑️</button>
</div>
</div>`;
});

container.innerHTML=html;
}

async function eliminarProducto(id){
if(!confirm('Eliminar producto?'))return;

await fetch(API_URL,{
method:'POST',
mode:'no-cors',
body:JSON.stringify({action:'eliminarProducto',id})
});

toast('Producto eliminado');
cargarProductosExistentes();
}

async function editarPrecioProducto(id,precio){
const nuevo=prompt('Nuevo precio',precio);
if(!nuevo)return;

await fetch(API_URL,{
method:'POST',
mode:'no-cors',
body:JSON.stringify({
action:'actualizarPrecio',
id,
precio:parseFloat(nuevo)
})
});

toast('Precio actualizado');
cargarProductosExistentes();
}

async function cargarProductosEditor(){
const container=document.getElementById('editableTable');

try{
const res=await fetch(`${API_URL}?action=getProductos&t=${Date.now()}`);
productosActuales=await res.json();

let html=`<table class="data-table">
<thead>
<tr>
<th>ID</th>
<th>Nombre</th>
<th>Precio</th>
<th>Origen</th>
</tr>
</thead><tbody>`;

productosActuales.forEach(prod=>{
html+=`
<tr>
<td>#${prod.id}</td>
<td>${escapeHtml(prod.nombre)}</td>
<td>$${Number(prod.precio).toFixed(2)}</td>
<td>${prod.origen||'-'}</td>
</tr>`;
});

html+='</tbody></table>';

container.innerHTML=html;

}catch(e){
container.innerHTML='Error';
}
}

// SOLICITUDES

function cargarSolicitudes(){
const saved=localStorage.getItem('solicitudes');
solicitudes=saved?JSON.parse(saved):[];
}

function guardarSolicitudes(){
localStorage.setItem('solicitudes',JSON.stringify(solicitudes));
}

function renderizarSolicitudesAdmin(){
const container=document.getElementById('solicitudesList');

cargarSolicitudes();

if(!solicitudes.length){
container.innerHTML='<div class="vacio">No hay solicitudes</div>';
return;
}

let html='';

[...solicitudes].reverse().forEach(s=>{
html+=`
<div class="card">
<strong>${s.codigo}</strong><br>
👤 ${escapeHtml(s.nombre)}<br>
📞 ${escapeHtml(s.telefono)}<br>
🛒 ${escapeHtml(s.plataforma)}<br>
<a href="${s.link}" target="_blank">Ver producto</a>

<div class="flex-row" style="margin-top:15px">
<input type="number" id="precio-${s.codigo}" placeholder="Precio">
<input type="text" id="respuesta-${s.codigo}" placeholder="Respuesta">

<select id="estado-${s.codigo}">
<option value="pendiente">Pendiente</option>
<option value="cotizado">Cotizado</option>
<option value="aprobado">Aprobado</option>
<option value="rechazado">Rechazado</option>
</select>

<button class="btn" onclick="actualizarSolicitud('${s.codigo}')">Actualizar</button>
</div>
</div>`;
});

container.innerHTML=html;
}

function actualizarSolicitud(codigo){
const solicitud=solicitudes.find(s=>s.codigo===codigo);

if(!solicitud)return;

const precio=document.getElementById(`precio-${codigo}`).value;
const respuesta=document.getElementById(`respuesta-${codigo}`).value;
const estado=document.getElementById(`estado-${codigo}`).value;

if(precio) solicitud.cotizacion=parseFloat(precio);
if(respuesta) solicitud.respuestaAdmin=respuesta;

solicitud.estado=estado;

guardarSolicitudes();
renderizarSolicitudesAdmin();

toast('Solicitud actualizada');
}

// TRACKING PEDIDOS

function cargarEstadosEnvio(){
const saved=localStorage.getItem('estados_envio');
return saved?JSON.parse(saved):{};
}

function guardarEstadoEnvio(pedidoId,estado){
const estados=cargarEstadosEnvio();

estados[pedidoId]={
estado,
fechaActualizacion:new Date().toISOString()
};

localStorage.setItem('estados_envio',JSON.stringify(estados));
}

async function cargarPedidosAdmin(){
try{
const response=await fetch(`${API_URL}?action=getPedidosConEnlaces&t=${Date.now()}`);
const pedidos=await response.json();
const estadosGuardados=cargarEstadosEnvio();
const container=document.getElementById('ordersList');

if(!pedidos.length){
container.innerHTML='<div class="vacio">Sin pedidos</div>';
return;
}

let html='';

pedidos.forEach(pedido=>{
const estadoActual=estadosGuardados[pedido.id]?.estado||'procesando';
const estadoInfo=estadosEnvio.find(e=>e.id===estadoActual)||estadosEnvio[0];

html+=`
<div class="card">
<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:10px">
<strong>📦 Pedido #${pedido.id}</strong>
<span>${new Date(pedido.fecha).toLocaleString()}</span>
<span class="estado-badge">${estadoInfo.nombre}</span>
</div>

<div>👤 ${pedido.nombre}</div>
<div>📞 ${pedido.telefono||'N/A'}</div>
<div>📍 ${pedido.direccion}</div>
<div>💰 $${(pedido.total||0).toFixed(2)}</div>

<div style="margin-top:15px">
<select id="estado-${pedido.id}">
${estadosEnvio.map(e=>`
<option value="${e.id}" ${estadoActual===e.id?'selected':''}>
${e.nombre}
</option>`).join('')}
</select>

<button class="btn" onclick="actualizarEstadoPedido(${pedido.id})">
Actualizar
</button>
</div>

<div style="margin-top:10px;color:#777">
📝 ${estadoInfo.descripcion}
</div>
</div>`;
});

container.innerHTML=html;

}catch(error){
console.error(error);
}
}

function actualizarEstadoPedido(pedidoId){
const nuevoEstado=document.getElementById(`estado-${pedidoId}`).value;

guardarEstadoEnvio(pedidoId,nuevoEstado);
sonidos.guardado();

toast('Estado actualizado');

cargarPedidosAdmin();
}

window.addEventListener('beforeunload',()=>{
coloresAgregar=[];
});

window.addEventListener('load',()=>{
cargarSolicitudes();
});

document.getElementById('adminPass').addEventListener('keypress',e=>{
if(e.key==='Enter') handleLogin();
});
</script>
</body>
</html>
