<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIENDA PRIVADA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        
        .header {
            text-align: center;
            padding: 30px;
            background: rgba(255,255,255,0.9);
            border-radius: 30px;
            margin-bottom: 30px;
        }
        .header h1 { color: #2e7d32; font-size: 2rem; }
        .header p { color: #558b2f; margin-top: 10px; }
        
        .filtros {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 30px;
        }
        .filtros select, .filtros input {
            padding: 12px 20px;
            border-radius: 50px;
            border: 2px solid #81c784;
            background: white;
            font-size: 0.9rem;
        }
        .filtros input { flex: 1; min-width: 200px; }
        
        .productos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }
        
        .producto-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: all 0.3s;
            cursor: pointer;
        }
        .producto-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(76,175,80,0.2);
        }
        .producto-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .producto-info { padding: 15px; }
        .producto-nombre {
            font-size: 1rem;
            font-weight: 700;
            color: #1b5e20;
            margin-bottom: 8px;
        }
        .producto-precio {
            font-size: 1.3rem;
            font-weight: 800;
            color: #4caf50;
        }
        .producto-origen {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            background: #e8f5e9;
            margin-top: 8px;
        }
        .paginacion {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 40px 0;
        }
        .paginacion button {
            padding: 12px 24px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 700;
        }
        .paginacion button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .loading {
            text-align: center;
            padding: 60px;
            color: #66bb6a;
            font-size: 1.2rem;
        }
        @media (max-width: 768px) {
            .productos-grid { grid-template-columns: 1fr; }
            .filtros { flex-direction: column; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🌿 TIENDA PRIVADA</h1>
        <p>✨ Estilo · Exclusividad · Seguridad · Sin límites ✨</p>
    </div>
    
    <div class="filtros">
        <select id="filtroCategoria">
            <option value="">Todas las categorías</option>
            <option value="ropa">👕 Ropa</option>
            <option value="zapatos">👟 Zapatos</option>
            <option value="accesorios">💍 Accesorios</option>
            <option value="electronica">📱 Electrónica</option>
            <option value="perfume">🌸 Perfume</option>
            <option value="maquillaje">💄 Maquillaje</option>
        </select>
        <select id="filtroOrigen">
            <option value="">Todos los orígenes</option>
            <option value="Amazon">📦 Amazon</option>
            <option value="Temu">📦 Temu</option>
            <option value="Shein">📦 Shein</option>
            <option value="Sephora">💄 Sephora</option>
        </select>
        <input type="text" id="filtroBusqueda" placeholder="🔍 Buscar productos...">
    </div>
    
    <div id="productos-container" class="productos-grid">
        <div class="loading">🔄 Cargando productos desde el servidor...</div>
    </div>
    
    <div id="paginacion" class="paginacion"></div>
</div>

<script>
// ========== CONFIGURACIÓN ==========
// ⚠️ TU URL DE NGROK - NO CAMBIES ESTO ⚠️
const API_URL = 'https://conjure-postal-lurk.ngrok-free.dev/tienda/api.php';

let paginaActual = 0;
const LIMITE = 20;
let totalProductos = 0;

// ========== Cargar productos ==========
async function cargarProductos() {
    const container = document.getElementById('productos-container');
    container.innerHTML = '<div class="loading">🔄 Cargando productos...</div>';
    
    const categoria = document.getElementById('filtroCategoria').value;
    const origen = document.getElementById('filtroOrigen').value;
    const busqueda = document.getElementById('filtroBusqueda').value;
    
    let url = `${API_URL}?action=productos&limit=${LIMITE}&offset=${paginaActual * LIMITE}`;
    if (categoria) url += `&categoria=${encodeURIComponent(categoria)}`;
    if (origen) url += `&origen=${encodeURIComponent(origen)}`;
    if (busqueda) url += `&busqueda=${encodeURIComponent(busqueda)}`;
    
    try {
        const response = await fetch(url);
        const data = await response.json();
        
        if (data.success) {
            totalProductos = data.total;
            renderizarProductos(data.data);
            renderizarPaginacion();
        } else {
            container.innerHTML = '<div class="loading">❌ Error al cargar productos</div>';
        }
    } catch (error) {
        console.error('Error:', error);
        container.innerHTML = '<div class="loading">❌ No se pudo conectar al servidor. ¿La TV Box está encendida?</div>';
    }
}

function renderizarProductos(productos) {
    const container = document.getElementById('productos-container');
    
    if (!productos.length) {
        container.innerHTML = '<div class="loading">📭 No hay productos en esta categoría</div>';
        return;
    }
    
    container.innerHTML = productos.map(p => `
        <div class="producto-card">
            <img src="${p.imagen || 'https://via.placeholder.com/300x200?text=Producto'}" 
                 onerror="this.src='https://via.placeholder.com/300x200?text=Sin+Imagen'">
            <div class="producto-info">
                <div class="producto-nombre">${escapeHtml(p.nombre)}</div>
                <div class="producto-precio">$${parseFloat(p.precio).toFixed(2)}</div>
                <span class="producto-origen">📦 ${p.origen || 'General'}</span>
                ${p.categoria ? `<span class="producto-origen">📂 ${p.categoria}</span>` : ''}
            </div>
        </div>
    `).join('');
}

function renderizarPaginacion() {
    const totalPaginas = Math.ceil(totalProductos / LIMITE);
    const container = document.getElementById('paginacion');
    
    if (totalPaginas <= 1) {
        container.innerHTML = '';
        return;
    }
    
    let html = '';
    html += `<button onclick="cambiarPagina(${paginaActual - 1})" ${paginaActual === 0 ? 'disabled' : ''}>◀ Anterior</button>`;
    html += `<span style="padding:10px">Página ${paginaActual + 1} de ${totalPaginas}</span>`;
    html += `<button onclick="cambiarPagina(${paginaActual + 1})" ${paginaActual >= totalPaginas - 1 ? 'disabled' : ''}>Siguiente ▶</button>`;
    
    container.innerHTML = html;
}

function cambiarPagina(pagina) {
    paginaActual = pagina;
    cargarProductos();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// ========== Event listeners ==========
document.getElementById('filtroCategoria').addEventListener('change', () => {
    paginaActual = 0;
    cargarProductos();
});
document.getElementById('filtroOrigen').addEventListener('change', () => {
    paginaActual = 0;
    cargarProductos();
});

let timeoutBusqueda;
document.getElementById('filtroBusqueda').addEventListener('input', () => {
    clearTimeout(timeoutBusqueda);
    timeoutBusqueda = setTimeout(() => {
        paginaActual = 0;
        cargarProductos();
    }, 500);
});

// ========== Iniciar ==========
cargarProductos();
</script>
</body>
</html>
